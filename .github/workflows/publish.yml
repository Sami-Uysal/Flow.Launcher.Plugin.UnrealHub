name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release zip
        run: |
          zip -r Flow.Launcher.Plugin.UnrealHub.zip . -x "*.git*" ".github*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Flow.Launcher.Plugin.UnrealHub.zip
          token: ${{ secrets.GITHUB_TOKEN }}
